aid: velotax
name: Velotax
description: >-
  Velotax is a Brazilian digital-credit fintech (mobile app plus velotax.com.br),
  operating 100% online, that offers unsecured personal loans and income-tax (IRPF)
  refund advances, disbursed via Pix within 30 minutes of approval — approving even
  "negativado" (poor-credit) customers because the anticipated tax refund secures
  repayment. Founded in 2020 by ex-J.P. Morgan bankers Eduardo Esmanhotto and Victor
  Savioli, it operates as a banking correspondent in partnership with VIA CAPITAL
  (a Brazilian Central Bank SCD), holds Reclame Aqui's top RA1000 reputation seal,
  has 3M+ app downloads, and raised a R$125M Series A in 2025 from QED Investors,
  Valor Capital and Picus Capital. Velotax is a consumer product and publishes no
  public developer API or OpenAPI surface.
